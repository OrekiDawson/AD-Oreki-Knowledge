name: AI 技术问答
description: 提交一个关于 AD-Oreki MOD 的技术问题，由 AI 工作流异步回答（仅仓库成员）
title: "[AI-QA] "
labels: ["ai-qa"]
body:
  - type: markdown
    attributes:
      value: |
        本表单会触发 ai-knowledge-qa.yml 异步问答。请尽量具体，并附上你已核对过的来源。
        仅仓库成员/协作者可触发；AI 回答会附带 GitHub 证据引用。
  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 想确认的技术事实或排查方向
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: 已知来源（可选）
      description: 相关 PR / Commit / 报告路径
    validations:
      required: false