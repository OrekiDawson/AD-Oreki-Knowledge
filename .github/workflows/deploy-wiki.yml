name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare Quartz 5 source (pinned)
        run: bash scripts/bootstrap-quartz.sh .quartz-build
      - name: Install dependencies
        working-directory: .quartz-build
        run: npm ci
      - name: Install Quartz plugins
        working-directory: .quartz-build
        run: npx quartz plugin install --from-config
      - name: AI keyword index
        working-directory: .quartz-build
        run: node scripts/ai/build-index.mjs
      - name: Content checks
        working-directory: .quartz-build
        run: node scripts/check-content.mjs
      - name: Build site
        working-directory: .quartz-build
        run: npx quartz build
      - name: Verify build output
        working-directory: .quartz-build
        run: node scripts/verify-build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz-build/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-online:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed site
        run: |
          BASE="http://wiki.oreki.net"
          for path in "/" "/index.html" "/static/contentIndex.json" "/static/knowledge-index.json" "/architecture/kotlin-runtime"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -s "$BASE/" | grep -q "AD-Oreki Knowledge Base"
          HTTPS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://wiki.oreki.net/ || true)
          echo "HTTPS -> $HTTPS_CODE（证书签发前为 000，不阻断）"
