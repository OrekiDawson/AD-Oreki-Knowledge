name: AI knowledge sync

on:
  workflow_dispatch:
    inputs:
      max_sources:
        description: "本次最多处理多少个来源"
        required: false
        default: "2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-knowledge-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run AI sync
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          KB_MAX_SOURCES: ${{ inputs.max_sources }}
        run: node scripts/ai/sync.mjs
      - name: Upload AI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-sync-${{ github.run_id }}
          path: evidence/ai-sync/
          if-no-files-found: ignore