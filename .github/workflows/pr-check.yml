name: KB PR check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate AI review scripts syntax
        run: |
          node --check scripts/ai/first-pr.mjs
          node --check scripts/ai/pr-review-prompt.mjs
          node --check scripts/ai/pr-review-report.mjs
      - name: Test daily PR selection and AI review contract (no model call)
        run: node --test scripts/ai/tests/*.test.mjs
      - name: Check HTTPS verification script syntax
        run: bash -n scripts/verify-https.sh
      - run: bash scripts/bootstrap-quartz.sh .quartz-build
      - run: npm ci
        working-directory: .quartz-build
      - run: npx quartz plugin install --from-config
        working-directory: .quartz-build
      - run: node scripts/ai/build-index.mjs
        working-directory: .quartz-build
      - run: node scripts/check-content.mjs
        working-directory: .quartz-build
      - run: npx quartz build
        working-directory: .quartz-build
      - run: node scripts/verify-build.mjs
        working-directory: .quartz-build